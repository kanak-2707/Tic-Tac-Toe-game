<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | Mini Project</title>

    <link rel="stylesheet" href="tic tac.css">
</head>

<body>

    <div class="game-container">

        <!-- Header -->
        <header>
            <div class="logo">✕⭕</div>

            <div>
                <h1>Tic Tac Toe</h1>
                <p>Classic game • Mini Project</p>
            </div>

            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>


        <!-- Game Mode -->
        <div class="mode-section">

            <button class="mode-btn active" data-mode="friend">
                👥 2 Players
            </button>

            <button class="mode-btn" data-mode="computer">
                🤖 vs Computer
            </button>

        </div>


        <!-- Score Board -->
        <div class="scoreboard">

            <div class="score-card x-card">

                <div class="player-icon">X</div>

                <div>
                    <span id="xName">Player X</span>
                    <strong id="scoreX">0</strong>
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="score-card o-card">

                <div class="player-icon">O</div>

                <div>
                    <span id="oName">Player O</span>
                    <strong id="scoreO">0</strong>
                </div>

            </div>

        </div>


        <!-- Turn -->
        <div class="turn-box">

            <span class="turn-dot"></span>

            <span id="turnText">
                Player X's Turn
            </span>

        </div>


        <!-- Game Board -->
        <div class="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>


        <!-- Message -->
        <div id="message" class="message"></div>


        <!-- Buttons -->
        <div class="actions">

            <button id="newGameBtn" class="new-game">
                🔄 New Game
            </button>

            <button id="resetScoreBtn" class="reset-score">
                🗑️ Reset Score
            </button>

        </div>


        <!-- Footer -->
        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>

    </div>


    <!-- Winner Popup -->

    <div id="winnerModal" class="modal">

        <div class="modal-content">

            <div class="trophy">🏆</div>

            <h2 id="winnerTitle">
                Player X Wins!
            </h2>

            <p id="winnerSubtitle">
                Congratulations!
            </p>

            <button id="modalBtn">
                Play Again
            </button>

        </div>

    </div>


    <script src="tic tac.js"></script>

</body>

</html>
